name: Weekly chaos and fuzzing

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  chaos-inprocess:
    runs-on: ubuntu-latest
    # 1,000 seeds took 2.7 min on a 4-core runner (5 min with the build);
    # a 2-core runner needs about twice that. The 1,000 membership seeds
    # take about as long again (3.7 min on 12 local cores).
    timeout-minutes: 45
    env:
      BSTK_CHAOS_VERBOSE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-04)
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: In-process chaos (1,000 seeds)
        run: BSTK_CHAOS_SEEDS=1000 cargo test --release -p bstk-chaos --test inprocess full -- --ignored --exact --nocapture
      - name: In-process membership chaos (1,000 seeds)
        run: BSTK_CHAOS_SEEDS=1000 cargo test --release -p bstk-chaos --test inprocess membership -- --ignored --exact --nocapture

  chaos-multiprocess:
    runs-on: ubuntu-latest
    # Runs are serial and last a fixed wall time each, so core count matters
    # little: 50 runs took 41 min (44 min with the build), and the 20
    # membership runs add about 20 min.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-04)
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build beanstalkd-rs (debug)
        run: |
          echo "cores: $(nproc)"
          cargo build -p bstk-server
          echo "BSTK_RS_BIN=$PWD/target/debug/beanstalkd-rs" >> "$GITHUB_ENV"
          echo "BSTK_CHAOS_DIR=$RUNNER_TEMP/chaos" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/chaos"
      - name: Multi-process chaos (50 runs)
        run: BSTK_CHAOS_MP_RUNS=50 cargo test --release -p bstk-chaos --test multiprocess full -- --ignored --exact --nocapture
      # 40 to 70 s each.
      - name: Multi-process membership chaos (20 runs)
        run: BSTK_CHAOS_MP_RUNS=20 cargo test --release -p bstk-chaos --test multiprocess membership -- --ignored --exact --nocapture
      - name: Upload chaos logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-logs
          path: ${{ runner.temp }}/chaos
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    # One job per target: 5 minutes of fuzzing (docs/DESIGN.md §9.2) plus the
    # nightly toolchain, cargo-fuzz and an ASan build.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [proto_decode, wal_read, raft_wire, snapshot_decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-04)
        with:
          toolchain: nightly-2026-10-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }} (5 minutes)
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo fuzz run -a ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- \
            -fork=2 -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=128
          # With -fork, libFuzzer exits 0 even after a crash (it passes the
          # child's raw wait status to exit()), so look for artifacts instead.
          if find artifacts/${{ matrix.target }} -type f | grep -q .; then
            echo "::error::${{ matrix.target }} found a crash, timeout or OOM"
            exit 1
          fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
