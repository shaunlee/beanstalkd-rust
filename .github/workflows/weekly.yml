name: Weekly chaos

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  chaos-inprocess:
    runs-on: ubuntu-latest
    # 1,000 seeds took 2.7 min on a 4-core runner (5 min with the build);
    # a 2-core runner needs about twice that.
    timeout-minutes: 30
    env:
      BSTK_CHAOS_VERBOSE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-04)
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: In-process chaos (1,000 seeds)
        run: BSTK_CHAOS_SEEDS=1000 cargo test --release -p bstk-chaos --test inprocess full -- --ignored --nocapture

  chaos-multiprocess:
    runs-on: ubuntu-latest
    # Runs are serial and last a fixed wall time each, so core count matters
    # little: 50 runs took 41 min (44 min with the build).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-04)
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build beanstalkd-rs (debug)
        run: |
          echo "cores: $(nproc)"
          cargo build -p bstk-server
          echo "BSTK_RS_BIN=$PWD/target/debug/beanstalkd-rs" >> "$GITHUB_ENV"
          echo "BSTK_CHAOS_DIR=$RUNNER_TEMP/chaos" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/chaos"
      - name: Multi-process chaos (50 runs)
        run: BSTK_CHAOS_MP_RUNS=50 cargo test --release -p bstk-chaos --test multiprocess full -- --ignored --nocapture
      - name: Upload chaos logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-logs
          path: ${{ runner.temp }}/chaos
          if-no-files-found: ignore
