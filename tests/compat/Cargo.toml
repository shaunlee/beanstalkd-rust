[package]
name = "bstk-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# TLS client side of the harness (blocking, over std TcpStream) and runtime
# generation of throwaway test certificates.
rustls = "0.23"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# Parsing `/admin` of cluster nodes (cluster mode).
serde_json = "1"

[lints]
workspace = true
