[package]
name = "bstk-chaos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Chaos testing of cluster mode (P3-T6): the history checker, a pausable
# TCP proxy, the in-process harness (simulated network, real storage) and
# the multi-process harness (real `beanstalkd-rs` processes).

[dependencies]
bytes.workspace = true
postcard.workspace = true
openraft.workspace = true
tokio.workspace = true
tracing.workspace = true
bstk-proto.workspace = true
bstk-engine.workspace = true
bstk-raft = { workspace = true, features = ["sim"] }
tempfile = "3.27.0"
nix = { version = "0.29", features = ["signal"] }
serde_json = "1"

[dev-dependencies]
# Paused time for the in-process harness (test targets only).
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
