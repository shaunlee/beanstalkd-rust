[package]
name = "bstk-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Load generator / benchmark for beanstalkd-compatible servers"

[[bin]]
name = "bstk-bench"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
clap.workspace = true
nix = { version = "0.29", features = ["resource"] }
# --tls (same versions and default aws-lc-rs provider as the server).
rustls = "0.23"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"

[lints]
workspace = true
