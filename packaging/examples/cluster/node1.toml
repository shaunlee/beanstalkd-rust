# beanstalkd-rs: node 1 of a 3-node cluster (node1.toml, node2.toml and
# node3.toml differ only in node_id, cluster.listen, the [cluster.tls] node
# certificate and the HTTP address). See docs/OPERATIONS.md section 5
# (certificates: scripts/mkcluster-certs.sh) and docs/DESIGN.md §8. Every
# key is documented in docs/beanstalkd-rs.example.toml.
#
# Addresses: nodes at 10.0.0.1, 10.0.0.2 and 10.0.0.3; clients use port
# 11300 on any node, nodes talk to each other on port 11400.
#
# Files (readable by the server's user):
#   /etc/beanstalkd-rs/tls/cluster-ca.pem  CA for cluster traffic
#   /etc/beanstalkd-rs/tls/node1.pem         this node's certificate: signed by
#                                         cluster-ca.pem, SAN DNS name
#                                         "bstk-node-1", extended key usage
#                                         serverAuth and clientAuth
#   /etc/beanstalkd-rs/tls/node1.key         its private key
#
# First start of a new cluster: every node once with --cluster-init (an
# empty data_dir is required). Later starts, and a node whose data_dir was
# wiped (it rejoins), without it. Never restore an old copy of data_dir.

[[listener]]
addr = "0.0.0.0:11300"

[cluster]
node_id = 1
listen = "10.0.0.1:11400"
# Raft log and snapshots; no [binlog] in cluster mode.
data_dir = "/var/lib/beanstalkd-rs"

[cluster.tls]
cert = "/etc/beanstalkd-rs/tls/node1.pem"
key = "/etc/beanstalkd-rs/tls/node1.key"
ca = "/etc/beanstalkd-rs/tls/cluster-ca.pem"

[[cluster.peer]]
id = 1
addr = "10.0.0.1:11400"
[[cluster.peer]]
id = 2
addr = "10.0.0.2:11400"
[[cluster.peer]]
id = 3
addr = "10.0.0.3:11400"

[http]
# /readyz answers 200 only while this node can serve clients (for example
# not while it is rejoining): use it for load-balancer health checks.
addr = "10.0.0.1:9180"

[log]
level = "info"
