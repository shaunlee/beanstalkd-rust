[workspace]
resolver = "3"
members = ["crates/proto", "crates/engine", "crates/store", "crates/engine-oracle", "crates/raft", "crates/server", "tests/compat", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
bstk-proto = { path = "crates/proto" }
bstk-engine = { path = "crates/engine" }
bstk-engine-oracle = { path = "crates/engine-oracle" }
bstk-raft = { path = "crates/raft" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
debug = 1
